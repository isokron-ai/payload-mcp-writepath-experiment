format: isokron/probe-experiment@1
id: E10-bulk-update-stale
run_id: e10-v2
title: bulk update by where with one document changed after the read (research v2 batching fix)
hypothesis: >-
  After findTasks reads Mara's five tasks and another writer then changes task 9's title through REST, one
  updateTasks with where owner = Mara (priority 5) also writes task 9 with no signal. On research v2 task 9 is refused
  as stale (its title and priority as the other writer left them) and the other four are updated.
arms:
  - name: test
    role: test
    description: MCP findTasks (owner Mara), REST PATCH of task 9 (title), MCP updateTasks where owner Mara priority 5 (one call)
    reps: 5
    reset: [task]
    steps:
      - { id: r, kind: call, tool: findTasks, args: { where: '{"owner":{"equals":"Mara"}}', limit: 50 } }
      - { id: b, kind: http, method: PATCH, path: /api/tasks/9, body: { title: 'Count tools (B)', priority: 4 }, content_type: application/json }
      - { id: w, kind: call, tool: updateTasks, args: { where: '{"owner":{"equals":"Mara"}}', priority: 5 } }
      - { id: s, kind: read, object: stale9 }
      - { id: after, kind: read, object: { path: '/api/tasks?where[owner][equals]=Mara&where[priority][equals]=5&limit=0&depth=0' } }
    counters:
      stale_written: 's.obj.doc.priority == 5'
      stale_kept: 's.obj.doc.priority == 4'
      others_updated: 'after.obj.totalDocs == 4'
      flagged_error: 'w.isError'
      names_stale: "w.text contains 'stale'"
    columns: { at_5: after.obj.totalDocs, p9: s.obj.doc.priority, isError: w.isError, head: w.text }
  - name: control
    role: control
    description: the same read and bulk update with no other writer (all five updated)
    reps: 5
    reset: [task]
    steps:
      - { id: r, kind: call, tool: findTasks, args: { where: '{"owner":{"equals":"Mara"}}', limit: 50 } }
      - { id: w, kind: call, tool: updateTasks, args: { where: '{"owner":{"equals":"Mara"}}', priority: 5 } }
      - { id: after, kind: read, object: { path: '/api/tasks?where[owner][equals]=Mara&where[priority][equals]=5&limit=0&depth=0' } }
    counters:
      all_updated: 'after.obj.totalDocs == 5'
      flagged_error: 'w.isError'
    columns: { at_5: after.obj.totalDocs, isError: w.isError }
verdict:
  criterion: >-
    reproduced (lost update) if the bulk update wrote task 9 in every valid repetition (at least 3); not reproduced if
    it never wrote task 9, updated the other four, flagged isError and said "stale" every time, while the control
    updated all five without isError every time; otherwise inconclusive.
  reproduced: { all: ['test.valid >= 3', 'test.stale_written == test.valid'] }
  not_reproduced: { all: ['test.valid >= 3', 'test.stale_kept == test.valid', 'test.others_updated == test.valid', 'test.flagged_error == test.valid', 'test.names_stale == test.valid', 'control.valid >= 3', 'control.all_updated == control.valid', 'control.flagged_error == 0'] }
