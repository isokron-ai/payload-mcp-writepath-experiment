format: isokron/probe-experiment@1
id: E11-bulk-delete-pinned
run_id: e11-v2
title: bulk delete with a per-document version map that pins one wrong version (research v2 ifUpdatedAt map)
hypothesis: >-
  deleteTasks with where owner = Mara and ifUpdatedAt {"9": <a version task 9 never had>} deletes task 9 anyway
  (the pin is ignored). On research v2 the map is honoured per document: task 9 is refused (isError, "stale",
  its current version given) and the other four are deleted. No earlier read, so only the pin applies.
arms:
  - name: test
    role: test
    description: MCP deleteTasks where owner Mara with ifUpdatedAt {"9":"2000-01-01T00:00:00.000Z"} (no earlier read)
    reps: 5
    reset: [task]
    steps:
      - { id: w, kind: call, tool: deleteTasks, args: { where: '{"owner":{"equals":"Mara"}}', ifUpdatedAt: { '9': '2000-01-01T00:00:00.000Z' } } }
      - { id: s, kind: read, object: stale9 }
      - { id: after, kind: read, object: { path: '/api/tasks?where[owner][equals]=Mara&limit=0&depth=0' } }
    counters:
      pinned_deleted: { not: s.obj.exists }
      pinned_kept: s.obj.exists
      others_deleted: 'after.obj.totalDocs == 1'
      flagged_error: 'w.isError'
      names_stale: "w.text contains 'stale'"
      says_best_effort: "w.text contains 'best_effort'"
    columns: { left: after.obj.totalDocs, isError: w.isError, head: w.text }
  - name: control
    role: control
    description: the same bulk delete without the version map (no read, no pin); all five deleted, no isError
    reps: 5
    reset: [task]
    steps:
      - { id: w, kind: call, tool: deleteTasks, args: { where: '{"owner":{"equals":"Mara"}}' } }
      - { id: after, kind: read, object: { path: '/api/tasks?where[owner][equals]=Mara&limit=0&depth=0' } }
    counters:
      all_deleted: 'after.obj.totalDocs == 0'
      flagged_error: 'w.isError'
    columns: { left: after.obj.totalDocs, isError: w.isError }
verdict:
  criterion: >-
    reproduced (pin ignored) if task 9 was deleted in every valid repetition (at least 3); not reproduced if task 9
    was kept, the other four deleted, isError set, "stale" named and the mode best_effort stated every time,
    while the control (no map) deleted all five without isError every time; otherwise inconclusive.
  reproduced: { all: ['test.valid >= 3', 'test.pinned_deleted == test.valid'] }
  not_reproduced: { all: ['test.valid >= 3', 'test.pinned_kept == test.valid', 'test.others_deleted == test.valid', 'test.flagged_error == test.valid', 'test.names_stale == test.valid', 'test.says_best_effort == test.valid', 'control.valid >= 3', 'control.all_deleted == control.valid', 'control.flagged_error == 0'] }
